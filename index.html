<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="icon" href="odin-lined.png" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="leftSide">
      <div class="header">
        <img src="odin-lined.png" />
        <h1>Odin</h1>
      </div>
    </nav>
    <div class="rightSide">
      <div class="rightTop">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started.
          <br />
          <br />
          <br />
          You know you want to.
        </p>
      </div>
      <div class="rightMiddle">
        <div class="input">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" required />
        </div>
        <div class="input">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" required />
        </div>
        <div class="input">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div class="input">
          <label for="phone">Phone</label>
          <input id="phone" type="number" required />
        </div>
        <div class="input">
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="3" />
        </div>
        <div class="input">
          <label for="passwordConf">Confirm Password</label>
          <input id="passwordConf" type="password" required minlength="3" />
        </div>
      </div>
      <div class="rightBottom">
        <button>Create Account</button>
        <p>Already have an account?<a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
